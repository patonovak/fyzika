<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Navzájom kolmé sily"><title>Navzájom kolmé sily</title><defs><marker id="1769aa" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker><marker id="168254" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#168254"/></marker><marker id="e97812" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e97812"/></marker></defs><rect width="900" height="520" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="50" fill="#17334b" font-size="30">Navzájom kolmé sily</text><path d="M160 120 l320 0" stroke="#8196a5" stroke-width="2" stroke-dasharray="7 7" fill="none"/><path d="M480 360 l0 -240" stroke="#8196a5" stroke-width="2" stroke-dasharray="7 7" fill="none"/><path d="M160 360 l320 0" fill="none" stroke="#1769aa" stroke-width="7" marker-end="url(#1769aa)"/><path d="M160 360 l0 -240" fill="none" stroke="#168254" stroke-width="7" marker-end="url(#168254)"/><path d="M160 360 l320 -240" fill="none" stroke="#e97812" stroke-width="7" marker-end="url(#e97812)"/><text x="270" y="405" fill="#1769aa" font-size="28">F₁ = 4 N</text><text x="22" y="230" fill="#168254" font-size="28">F₂ = 3 N</text><text x="335" y="160" fill="#e97812" font-size="28">F = 5 N</text><path d="M160 330 h30 v30" fill="none" stroke="#17334b" stroke-width="2"/><text x="565" y="320" fill="#17334b" font-size="28">F² = F₁² + F₂²</text><text x="565" y="365" fill="#17334b" font-size="28">F = 5 N</text></g></svg>